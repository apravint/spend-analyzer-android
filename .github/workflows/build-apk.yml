name: Build Flutter App & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Test & Build Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Build Flutter Web Demo
        run: flutter build web --release --base-href "/spend-analyzer-android/"

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendAnalyzer-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web Artifact for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: SpendAnalyzer AI ${{ github.ref_name }}
          body: |
            ### 💳 SpendAnalyzer AI Release (${{ github.ref_name }})
            - Upgraded to modern **Flutter 3.x / Dart 3.x** native architecture.
            - Deep midnight obsidian glassmorphism UI with emerald/mint financial palette.
            - 100% offline, private on-device regex parsing for Indian bank & UPI SMS.
            - 4 Core Modules: Financial Dashboard, Filterable Transactions, Expense Insights, and Interactive SMS Regex Tester.
            - Android 15 (SDK 35) Edge-to-Edge compliance.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
